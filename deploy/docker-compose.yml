# 덴트모아 서버 구성
#   app   : 덴트모아 (대시보드 + 하루 3번 수집·알림)
#   caddy : https 인증서를 자동으로 받아 app 으로 연결하는 웹 서버
#
# deploy/ 폴더에서 실행한다:
#   cd ~/dentmoa/deploy
#   sudo docker compose up -d --build     시작(또는 다시 만들고 시작)
#   sudo docker compose logs -f app       로그 보기 (나가기: Ctrl+C)
#   sudo docker compose restart app       다시 시작
# 설정은 같은 폴더의 .env (install.sh 가 env.example 을 복사해 만든다)

name: dentmoa

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: dentmoa:latest
    env_file: .env
    environment:
      DENTMOA_BEHIND_PROXY: "1"  # 앞단의 Caddy 가 알려주는 접속 IP·https 정보를 믿는다
    volumes:
      - ../data:/data  # 공고·설정·로그인 쿠키가 저장되는 곳 (서버의 ~/dentmoa/data)
    shm_size: 512m  # 크로미움(브라우저)이 쓰는 공유 메모리
    restart: unless-stopped
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: "${DOMAIN:?deploy/.env 에 DOMAIN 이 없습니다. 먼저 sudo bash deploy/install.sh 를 실행해 주세요}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data  # 받은 https 인증서
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped
    logging: *logging

volumes:
  caddy_data:
  caddy_config:
