<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>하이브레인넷</title></head>
<body>
<!-- 실제 사이트 화면(2026-10)에서 필요한 부분만 남기고 전화번호·이메일은 지움 -->
<div class="login-form-layout">
<div class="hbn-login-form">
<div class="login-banner">
<a href="/ads/174947/count" target="_blank"></a>
</div>
<div class="login-form-wrap">
<div class="login-form-header">

<div class="login-form-title">
                                하나의 아이디로 하이브레인넷, 하이그래드넷 서비스를<br/>함께 이용하실 수 있습니다.
                            </div>
<div class="server-error-message"><span>    회원전용 메뉴이니 로그인후에 이용바랍니다. 
                </span></div>
</div>
<form action="/logins/signin?redirectUrl=%2Frecruitment%2Frecruits%2F3592631" class="login-form" id="idInfo" method="post">
<div class="form-group userid">
<input autocomplete="off" class="login-input user-id" id="userid" name="userid" placeholder="아이디" tabindex="1" type="text"/>
<div class="errorWrap formMessageBlock hbnRED">
</div> </div>
<div class="form-group">
<input autocomplete="off" class="login-input" id="passwd" name="passwd" placeholder="비밀번호" tabindex="2" type="password"/>
<div class="errorWrap formMessageBlock hbnRED">
</div> </div>
<input class="btnSubmit login-button" id="submit-btn" onclick="insertLocalStorage('articleAgreement',true);" tabindex="3" type="submit" value="로그인"/>
<div class="login-etc-button">
<input class="input-etc-button" id="isAutoSignin" name="isAutoSignin" type="checkbox" value="true"/>
<label class="etc-button check left" for="isAutoSignin">자동로그인</label>
<a class="etc-button right" href="/logins/findpasswd">비밀번호 찾기</a>
<a class="etc-button right divided-bar" href="/logins/findid">아이디 찾기</a>
</div>
</form>
<div class="signup-comment">아직 회원이 아니세요? <a class="signup-link" href="/logins/signup/info">회원가입</a></div>
</div>
</div> </div>
</body></html>
